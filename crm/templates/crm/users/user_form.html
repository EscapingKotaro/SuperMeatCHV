{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-lg rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h2 class="mb-6 text-2xl font-bold">Новый сотрудник</h2>
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Логин</label>
                <input type="text" name="username" required class="w-full rounded-xl border border-slate-300 px-4 py-2 focus:border-[#FF5C35] focus:outline-none focus:ring-1 focus:ring-[#FF5C35]">
            </div>
            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Пароль</label>
                <input type="text" name="password" required class="w-full rounded-xl border border-slate-300 px-4 py-2 focus:border-[#FF5C35] focus:outline-none focus:ring-1 focus:ring-[#FF5C35]">
                <p class="mt-1 text-xs text-slate-500">Рекомендуется использовать временный пароль.</p>
            </div>
            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Роль</label>
                <select name="role" class="w-full rounded-xl border border-slate-300 px-4 py-2 focus:border-[#FF5C35] focus:outline-none focus:ring-1 focus:ring-[#FF5C35]">
                    {% for value, label in user.Role.choices %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="pt-4 flex gap-3">
                <button type="submit" class="flex-1 rounded-xl bg-[#FF5C35] py-2.5 font-semibold text-white hover:bg-[#e04a25] transition">Создать</button>
                <a href="{% url 'user_list' %}" class="flex-1 rounded-xl border border-slate-300 py-2.5 text-center font-semibold text-slate-700 hover:bg-slate-50 transition">Отмена</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
