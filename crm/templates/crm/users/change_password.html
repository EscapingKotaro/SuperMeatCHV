{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h2 class="mb-6 text-2xl font-bold">Смена пароля</h2>
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Текущий пароль</label>
                <input type="password" name="old_password" required class="w-full rounded-xl border border-slate-300 px-4 py-2 focus:border-[#FF5C35] focus:outline-none focus:ring-1 focus:ring-[#FF5C35]">
            </div>
            <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Новый пароль</label>
                <input type="password" name="new_password" required class="w-full rounded-xl border border-slate-300 px-4 py-2 focus:border-[#FF5C35] focus:outline-none focus:ring-1 focus:ring-[#FF5C35]">
            </div>
            <button type="submit" class="mt-4 w-full rounded-xl bg-[#FF5C35] py-2.5 font-semibold text-white hover:bg-[#e04a25] transition">Обновить пароль</button>
        </div>
    </form>
</div>
{% endblock %}
